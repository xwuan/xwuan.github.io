<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13172e"/>
      <stop offset="100%" stop-color="#0a0c1a"/>
    </linearGradient>
    <linearGradient id="geminiG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="100" height="100" rx="22" fill="url(#bgG)" stroke="#1e284a" stroke-width="2"/>
  <!-- Gemini Sparkle Core -->
  <path d="M50 18 C50 35.6 35.6 50 18 50 C35.6 50 50 64.4 50 82 C50 64.4 64.4 50 82 50 C64.4 50 50 35.6 50 18 Z" fill="url(#geminiG)" filter="url(#glow)"/>
  <!-- Central bright core -->
  <circle cx="50" cy="50" r="4" fill="#ffffff" opacity="0.9"/>
</svg>
